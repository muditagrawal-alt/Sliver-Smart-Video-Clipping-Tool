<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sliver — Account</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass { backdrop-filter: blur(14px); background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); }
    .neon { box-shadow: 0 0 25px rgba(99,102,241,0.35); }
    .gradient-text {
      background: linear-gradient(90deg,#6366f1,#ec4899,#22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>

<body class="bg-black text-white">

  <!-- NAV -->
  <nav class="flex items-center justify-between px-8 py-5 border-b border-white/10">
    <div class="text-2xl font-extrabold gradient-text">Sliver</div>
    <div class="flex gap-6">
      <a href="index.html" class="text-white/70 hover:text-white">Home</a>
      <a href="tool.html" class="text-white/70 hover:text-white">Create</a>
      <a href="library.html" class="text-white/70 hover:text-white">Library</a>
      <a href="profile.html" class="text-white font-semibold">Account</a>
    </div>
  </nav>

  <!-- HEADER -->
  <section class="max-w-5xl mx-auto px-6 py-12">
    <h1 class="text-4xl font-extrabold mb-2">
      Account <span class="gradient-text">Settings</span>
    </h1>
    <p class="text-white/60">
      Manage your Sliver account, preferences, and usage.
    </p>
  </section>

  <!-- PROFILE -->
  <section class="max-w-5xl mx-auto px-6 pb-20">
    <div class="glass rounded-2xl p-8 neon">

      <!-- USER -->
      <div class="flex items-center gap-6 mb-10">
        <div class="w-20 h-20 rounded-full bg-white/10 flex items-center justify-center text-2xl font-semibold">
          MA
        </div>
        <div>
          <h2 class="text-2xl font-semibold">Mudit Agrawal</h2>
          <p class="text-white/60">mudit@email.com</p>
          <p class="text-white/40 text-sm">Account ID: SLV-20421</p>
        </div>
      </div>

      <!-- USAGE -->
      <div class="grid md:grid-cols-3 gap-6 mb-10">
        <div class="glass rounded-xl p-5">
          <div class="text-sm text-white/60 mb-1">Clips Generated</div>
          <div class="text-2xl font-bold gradient-text">24</div>
        </div>

        <div class="glass rounded-xl p-5">
          <div class="text-sm text-white/60 mb-1">Videos Processed</div>
          <div class="text-2xl font-bold gradient-text">12</div>
        </div>

        <div class="glass rounded-xl p-5">
          <div class="text-sm text-white/60 mb-1">Total Processing Time</div>
          <div class="text-2xl font-bold gradient-text">3h 24m</div>
        </div>
      </div>

      <!-- ACCOUNT SETTINGS -->
      <div class="space-y-6 mb-10">

        <div>
          <label class="block text-white/70 mb-2">Full Name</label>
          <input type="text" value="Mudit Agrawal"
            class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>

        <div>
          <label class="block text-white/70 mb-2">Email</label>
          <input type="email" value="mudit@email.com"
            class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>

        <div>
          <label class="block text-white/70 mb-2">Organization (optional)</label>
          <input type="text" placeholder="Company or team"
            class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>

      </div>

      <!-- ACTIONS -->
      <div class="flex flex-wrap gap-4 justify-between items-center">
        <button class="px-6 py-3 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 hover:opacity-90">
          Save Changes
        </button>

        <div class="flex gap-3">
          <button class="px-6 py-3 rounded-xl border border-white/20 hover:bg-white/5">
            Change Password
          </button>
          <button class="px-6 py-3 rounded-xl border border-red-500/40 text-red-400 hover:bg-red-500/10">
            Logout
          </button>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
