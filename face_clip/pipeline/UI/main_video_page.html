<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sliver – Smart Video Clipping</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-6xl mx-auto p-6">
    <!-- Header -->
    <header class="mb-6">
      <h1 class="text-3xl font-bold text-gray-800">Sliver</h1>
      <p class="text-gray-500">AI‑Powered Smart Video Clipping Tool</p>
    </header>

    <!-- Upload Section -->
    <div class="bg-white rounded-2xl shadow p-6 mb-6">
      <h2 class="text-xl font-semibold mb-4">Upload Video</h2>
      <input id="videoInput" type="file" accept="video/*" class="mb-4" />
      <button id="processBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
        Process Video
      </button>
      <div id="status" class="mt-3 text-sm text-gray-600"></div>
    </div>

    <!-- Video Preview -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white rounded-2xl shadow p-4">
        <h2 class="text-lg font-semibold mb-2">Original Video</h2>
        <video id="originalVideo" controls class="w-full rounded-lg"></video>
      </div>
      <div class="bg-white rounded-2xl shadow p-4">
        <h2 class="text-lg font-semibold mb-2">Highlight Output</h2>
        <video id="highlightVideo" controls class="w-full rounded-lg"></video>
      </div>
    </div>

    <!-- Detected Clips -->
    <div class="bg-white rounded-2xl shadow p-6 mt-6">
      <h2 class="text-xl font-semibold mb-4">Detected Key Segments</h2>
      <div id="clipsList" class="space-y-3"></div>
    </div>
  </div>

  <script>
    const videoInput = document.getElementById("videoInput");
    const originalVideo = document.getElementById("originalVideo");
    const highlightVideo = document.getElementById("highlightVideo");
    const processBtn = document.getElementById("processBtn");
    const status = document.getElementById("status");
    const clipsList = document.getElementById("clipsList");

    let uploadedFile = null;

    videoInput.addEventListener("change", () => {
      uploadedFile = videoInput.files[0];
      if (uploadedFile) {
        originalVideo.src = URL.createObjectURL(uploadedFile);
        status.textContent = "Video loaded. Ready to process.";
      }
    });

    processBtn.addEventListener("click", async () => {
      if (!uploadedFile) {
        status.textContent = "Please upload a video first.";
        return;
      }

      status.textContent = "Processing… detecting key segments.";

      const formData = new FormData();
      formData.append("video", uploadedFile);

      try {
        const res = await fetch("/process", {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        highlightVideo.src = data.highlight_url;
        clipsList.innerHTML = "";

        data.clips.forEach((clip, i) => {
          const div = document.createElement("div");
          div.className = "p-3 border rounded-lg flex justify-between";
          div.innerHTML = `
            <span>Clip ${i + 1}: ${clip.start.toFixed(2)}s – ${clip.end.toFixed(2)}s</span>
            <button class="text-blue-600" onclick="previewClip(${clip.start}, ${clip.end})">Preview</button>
          `;
          clipsList.appendChild(div);
        });

        status.textContent = "Processing complete.";
      } catch (e) {
        status.textContent = "Error processing video.";
      }
    });

    function previewClip(start, end) {
      originalVideo.currentTime = start;
      originalVideo.play();
      setTimeout(() => originalVideo.pause(), (end - start) * 1000);
    }
  </script>
</body>
</html>
