<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sliver — Create Highlights</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass { backdrop-filter: blur(14px); background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); }
    .neon { box-shadow: 0 0 25px rgba(99,102,241,0.45); }
    .gradient-text {
      background: linear-gradient(90deg,#6366f1,#ec4899,#22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="bg-black text-white">

  <!-- NAV -->
  <nav class="flex items-center justify-between px-8 py-5 border-b border-white/10">
    <div class="text-2xl font-extrabold gradient-text">Sliver</div>
    <a href="index.html" class="text-white/70 hover:text-white transition">Home</a>
  </nav>

  <!-- HERO -->
  <section class="text-center py-16 px-6">
    <h1 class="text-4xl md:text-5xl font-extrabold mb-4">
      Turn Raw Footage into <span class="gradient-text">Viral Clips</span>
    </h1>
    <p class="text-white/60 max-w-2xl mx-auto">
      Upload your video, choose highlight intensity and duration, and let Sliver extract the most engaging moments automatically.
    </p>
  </section>

  <!-- UPLOAD CARD -->
  <section class="max-w-5xl mx-auto px-6 pb-16">
    <div class="glass rounded-2xl p-8 neon">
      
      <!-- Upload -->
      <div class="mb-8">
        <label class="block text-white/70 mb-3">Upload Video</label>
        <label class="border-2 border-dashed border-white/20 rounded-xl p-10 text-center hover:border-indigo-400 transition cursor-pointer block">
  <div id="uploadPlaceholder">
    <p class="text-white/60">Drag & drop your video here or click to browse</p>
  </div>
  <video id="videoPreview" controls class="hidden mt-4 rounded-lg max-h-64 mx-auto"></video>
  <p id="fileName" class="text-white/50 text-sm mt-3 hidden"></p>
  <input id="videoInput" type="file" accept="video/*" class="hidden" />
</label>

<script>
  const videoInput = document.getElementById('videoInput');
  const videoPreview = document.getElementById('videoPreview');
  const fileName = document.getElementById('fileName');
  const placeholder = document.getElementById('uploadPlaceholder');

  videoInput.addEventListener('change', () => {
    const file = videoInput.files[0];
    if (!file) return;

    fileName.textContent = file.name;
    fileName.classList.remove('hidden');

    const url = URL.createObjectURL(file);
    videoPreview.src = url;
    videoPreview.classList.remove('hidden');

    placeholder.classList.add('hidden');
  });
</script>
      </div>

      <!-- Controls -->
      <div class="mb-8">
        <label class="block text-white/70 mb-2">Clip Duration</label>
        <div class="flex gap-2">
          <input id="durationInput" type="number" min="1" value="30"
            class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
          <select id="durationUnit"
            class="bg-white/10 border border-white/20 rounded-xl px-3 py-3 text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
            <option value="seconds">Seconds</option>
            <option value="minutes">Minutes</option>
          </select>
        </div>
      </div>

      <button id="generateBtn"
        class="w-full py-4 rounded-xl font-semibold text-white bg-gradient-to-r from-pink-500 to-purple-600 hover:opacity-90 transition">
        Generate Highlights
      </button>
    </div>
  </section>

  <!-- RESULTS -->
  <section class="max-w-6xl mx-auto px-6 pb-24">
    <h2 class="text-2xl font-bold mb-8">Generated Clips</h2>
    <div class="grid md:grid-cols-3 gap-6">
      
      <div class="glass rounded-xl overflow-hidden">
        <video controls class="w-full"></video>
        <div class="p-4 flex justify-between items-center">
          <span class="text-white/70">Clip 1</span>
          <button class="text-indigo-400 hover:text-indigo-300">Download</button>
        </div>
      </div>

      <div class="glass rounded-xl overflow-hidden">
        <video controls class="w-full"></video>
        <div class="p-4 flex justify-between items-center">
          <span class="text-white/70">Clip 2</span>
          <button class="text-indigo-400 hover:text-indigo-300">Download</button>
        </div>
      </div>

      <div class="glass rounded-xl overflow-hidden">
        <video controls class="w-full"></video>
        <div class="p-4 flex justify-between items-center">
          <span class="text-white/70">Clip 3</span>
          <button class="text-indigo-400 hover:text-indigo-300">Download</button>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
