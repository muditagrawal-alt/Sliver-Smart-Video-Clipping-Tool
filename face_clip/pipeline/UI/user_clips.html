<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sliver — My Clips</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass { backdrop-filter: blur(14px); background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); }
    .neon { box-shadow: 0 0 25px rgba(99,102,241,0.45); }
    .gradient-text {
      background: linear-gradient(90deg,#6366f1,#ec4899,#22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>

<body class="bg-black text-white">

  <!-- NAV -->
  <nav class="flex items-center justify-between px-8 py-5 border-b border-white/10">
    <div class="text-2xl font-extrabold gradient-text">Sliver</div>
    <div class="flex gap-6">
      <a href="index.html" class="text-white/70 hover:text-white">Home</a>
      <a href="tool.html" class="text-white/70 hover:text-white">Create</a>
      <a href="library.html" class="text-white font-semibold">My Clips</a>
    </div>
  </nav>

  <!-- HEADER -->
  <section class="max-w-6xl mx-auto px-6 py-12">
    <h1 class="text-4xl font-extrabold mb-2">
      Your <span class="gradient-text">Generated Clips</span>
    </h1>
    <p class="text-white/60">
      Access, preview, and download all your previously created highlights.
    </p>
  </section>

  <!-- CLIPS GRID -->
  <section class="max-w-6xl mx-auto px-6 pb-20">
    <div id="clipsGrid" class="grid md:grid-cols-3 gap-6">

      <!-- Clip Card -->
      <div class="glass rounded-xl overflow-hidden neon">
        <video controls class="w-full">
          <source src="sample1.mp4" type="video/mp4">
        </video>
        <div class="p-4 flex justify-between items-center">
          <span class="text-white/70">12s</span>
          <div class="flex gap-3">
            <button class="text-indigo-400 hover:text-indigo-300">Download</button>
            <button class="text-red-400 hover:text-red-300">Delete</button>
          </div>
        </div>
      </div>

      <div class="glass rounded-xl overflow-hidden">
        <video controls class="w-full">
          <source src="sample2.mp4" type="video/mp4">
        </video>
        <div class="p-4 flex justify-between items-center">
          <span class="text-white/70">30s</span>
          <div class="flex gap-3">
            <button class="text-indigo-400 hover:text-indigo-300">Download</button>
            <button class="text-red-400 hover:text-red-300">Delete</button>
          </div>
        </div>
      </div>

      <div class="glass rounded-xl overflow-hidden">
        <video controls class="w-full">
          <source src="sample3.mp4" type="video/mp4">
        </video>
        <div class="p-4 flex justify-between items-center">
          <span class="text-white/70">45s</span>
          <div class="flex gap-3">
            <button class="text-indigo-400 hover:text-indigo-300">Download</button>
            <button class="text-red-400 hover:text-red-300">Delete</button>
          </div>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
