<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sliver — Login / Register</title>

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen flex">

  <!-- LEFT BRAND -->
  <div class="hidden lg:flex w-1/2 bg-gradient-to-br from-purple-600 to-blue-600 items-center justify-center p-12">
    <div class="max-w-md">
      <div class="flex items-center space-x-3 mb-6">
        <div class="w-10 h-10 bg-white/20 rounded-lg"></div>
        <div>
          <div class="text-2xl font-bold">Sliver</div>
          <div class="text-sm opacity-80">AI Video Highlights</div>
        </div>
      </div>
      <h2 class="text-3xl font-bold mb-4">Turn long videos into powerful moments</h2>
      <p class="opacity-80">
        Upload footage, let AI detect key scenes, and generate highlight clips instantly.
      </p>
    </div>
  </div>

  <!-- RIGHT AUTH -->
  <div class="flex w-full lg:w-1/2 items-center justify-center p-8">

    <div class="w-full max-w-md">

      <!-- TABS -->
      <div class="flex mb-8 border-b border-gray-700">
        <button id="loginTab" class="flex-1 py-3 font-semibold border-b-2 border-purple-500">
          Login
        </button>
        <button id="registerTab" class="flex-1 py-3 text-gray-400">
          Register
        </button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="space-y-4">
        <input type="email" placeholder="Email"
          class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-500">

        <input type="password" placeholder="Password"
          class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-500">

        <button class="w-full bg-gradient-to-r from-purple-500 to-blue-500 py-3 rounded-lg font-semibold hover:opacity-90">
          Login
        </button>

        <div class="text-center text-gray-400 text-sm">or continue with</div>

        <div class="space-y-3">

          <!-- Google -->
          <button type="button"
            class="w-full flex items-center justify-center gap-3 border border-gray-700 py-3 rounded-lg hover:bg-gray-800 transition">
            <svg width="20" height="20" viewBox="0 0 48 48">
              <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.1 29.3 35 24 35c-6.1 0-11-4.9-11-11S17.9 13 24 13c2.7 0 5.2 1 7.1 2.7l5.7-5.7C33.5 6.5 28.9 5 24 5 12.4 5 3 14.4 3 26s9.4 21 21 21 21-9.4 21-21c0-1.8-.2-3.6-.4-5.5z"/>
              <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16.1 19 13 24 13c2.7 0 5.2 1 7.1 2.7l5.7-5.7C33.5 6.5 28.9 5 24 5c-7.7 0-14.3 4.4-17.7 10.7z"/>
              <path fill="#4CAF50" d="M24 47c5.2 0 10-2 13.7-5.3l-6.3-5.2C29.5 38.9 26.9 40 24 40c-5.3 0-9.8-3.6-11.4-8.5l-6.5 5C9.5 42.7 16.2 47 24 47z"/>
              <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.5 5.8-6.9 7.3l6.3 5.2C39.9 36.9 45 31 45 24c0-1.8-.2-3.6-.4-5.5z"/>
            </svg>
            <span>Continue with Google</span>
          </button>

          <!-- Microsoft -->
          <button type="button"
            class="w-full flex items-center justify-center gap-3 border border-gray-700 py-3 rounded-lg hover:bg-gray-800 transition">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <rect x="1" y="1" width="10" height="10" fill="#F25022"/>
              <rect x="13" y="1" width="10" height="10" fill="#7FBA00"/>
              <rect x="1" y="13" width="10" height="10" fill="#00A4EF"/>
              <rect x="13" y="13" width="10" height="10" fill="#FFB900"/>
            </svg>
            <span>Continue with Microsoft</span>
          </button>

        </div>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" class="space-y-4 hidden">
        <input type="text" placeholder="Full Name"
          class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-500">

        <input type="email" placeholder="Email"
          class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-500">

        <input type="password" placeholder="Password"
          class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-500">

        <button class="w-full bg-gradient-to-r from-purple-500 to-blue-500 py-3 rounded-lg font-semibold hover:opacity-90">
          Create Account
        </button>
      </form>

    </div>
  </div>

  <!-- TOGGLE SCRIPT -->
  <script>
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    loginTab.onclick = () => {
      loginForm.classList.remove("hidden");
      registerForm.classList.add("hidden");
      loginTab.classList.add("border-purple-500");
      registerTab.classList.remove("border-purple-500");
      registerTab.classList.add("text-gray-400");
    };

    registerTab.onclick = () => {
      registerForm.classList.remove("hidden");
      loginForm.classList.add("hidden");
      registerTab.classList.add("border-purple-500");
      loginTab.classList.remove("border-purple-500");
    };
  </script>

</body>
</html>
